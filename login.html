<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas — SPMB SMK Muhammadiyah 1 Surakarta</title>
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>
    <h1 class="login-title">Login Petugas</h1>
    <p class="login-subtitle">SPMB SMK Muhammadiyah 1 Surakarta</p>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input"
               autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
        Masuk
      </button>
    </form>

    <p class="text-center mt-3">
      <a href="index.html" class="text-muted" style="font-size:0.85rem;">← Kembali ke halaman utama</a>
    </p>
  </div>
</div>

<script src="config.js?v=1.0.0"></script>
<script src="utils.js?v=1.0.0"></script>
<script src="api.js?v=1.0.0"></script>
<script src="auth.js?v=1.0.0"></script>
<script>
  (function () {
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
      return;
    }

    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        Utils.toast('Username dan password wajib diisi', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      Utils.showLoading('Memverifikasi...');

      Api.auth.login(username, password)
        .then(function (res) {
          if (res.success) {
            Auth.saveSession(res.data);
            Utils.toast('Login berhasil', 'success');
            setTimeout(function () {
              window.location.href = 'dashboard.html';
            }, 600);
          } else {
            Utils.toast(res.message || 'Login gagal', 'error');
          }
        })
        .catch(function (err) {
          Utils.toast(err.message || 'Gagal terhubung ke server', 'error');
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = 'Masuk';
          Utils.hideLoading();
        });
    });
  })();
</script>
</body>
</html>
