<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPMB SMK Muhammadiyah 1 Surakarta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #1a5490 0%, #143f6e 100%);
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo { max-width: 100px; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #1a5490; margin-bottom: 8px; }
  .subtitle { font-size: 0.95rem; color: #6b7280; margin-bottom: 32px; line-height: 1.5; }
  .btn {
    display: block;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    margin-bottom: 12px;
    transition: all 0.2s;
  }
  .btn-primary { background: #1a5490; color: #fff; }
  .btn-primary:hover { background: #143f6e; }
  .btn-secondary { background: #e5e7eb; color: #1f2937; }
  .btn-secondary:hover { background: #d1d5db; }
  .footnote { font-size: 0.75rem; color: #6b7280; margin-top: 20px; }
</style>
</head>
<body>

<div class="card">
  <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
  <h1 id="school-name">SMK Muhammadiyah 1 Surakarta</h1>
  <p class="subtitle">
    Sistem Penerimaan Murid Baru<br>
    Tahun Pelajaran <span id="tahun-ajaran">...</span>
  </p>

  <a href="register.html" class="btn btn-primary">Daftar Sekarang</a>
  <a href="login.html" class="btn btn-secondary">Login Petugas</a>

  <p class="footnote">
    Dengan mendaftar, Anda menyetujui pemrosesan data pribadi untuk keperluan Penerimaan Murid Baru.
  </p>
</div>

<script>
(function () {
  var APPS_URL = 'https://script.google.com/macros/s/AKfycby8LtbUq51b2exJNsESeQN2iTOtLgkMfDrl6lrzLXuBe65I0kNFsOuoF7qpFZGpDH3K/exec';

  function b64encode(str) {
    var utf8 = unescape(encodeURIComponent(str));
    return btoa(utf8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  var payload = { action: 'settings.getPublic', token: null, payload: {} };
  var b64 = b64encode(JSON.stringify(payload));
  var url = APPS_URL + '?data=' + encodeURIComponent(b64);

  fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var json = JSON.parse(text);
      if (json.success && json.data && json.data.settings) {
        var s = json.data.settings;
        if (s.nama_sekolah) document.getElementById('school-name').textContent = s.nama_sekolah;
        if (s.tahun_ajaran) document.getElementById('tahun-ajaran').textContent = s.tahun_ajaran;
      }
    })
    .catch(function (err) {
      console.warn('[SPMB] gagal memuat pengaturan:', err.message);
    });
})();
</script>
</body>
</html>
