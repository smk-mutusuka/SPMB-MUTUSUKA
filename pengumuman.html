<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman SPMB — SMK Muhammadiyah 1 Surakarta</title>
<link rel="icon" href="logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1a5490 0%, #143f6e 100%);
    color: #1f2937; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 16px;
    max-width: 720px; width: 100%; padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .head { text-align: center; margin-bottom: 24px; }
  .head img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
  .head h1 { font-size: 1.2rem; color: #1a5490; margin-bottom: 4px; }
  .head p { font-size: 0.85rem; color: #6b7280; }
  .form-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .form-row input { flex: 1; padding: 14px 18px; border: 2px solid #d1d5db;
    border-radius: 10px; font-size: 1rem; font-family: inherit;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .form-row input:focus { outline: none; border-color: #1a5490;
    box-shadow: 0 0 0 4px rgba(26,84,144,0.1); }
  .form-row button { padding: 14px 24px; background: #1a5490; color: #fff;
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap; }
  .form-row button:hover { background: #143f6e; }
  .form-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .back-link { text-align: center; margin-top: 16px; }
  .back-link a { color: #6b7280; text-decoration: none; font-size: 0.85rem; }
  .back-link a:hover { color: #1a5490; }
  .result { display: none; }
  .result.show { display: block; }
  .result-head { text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
  .result-head.ACC { background: #ecfdf5; border: 2px solid #059669; }
  .result-head.CAD { background: #fef3c7; border: 2px solid #d97706; }
  .result-head.REJ { background: #fee2e2; border: 2px solid #dc2626; }
  .result-head .icon { font-size: 3rem; margin-bottom: 8px; }
  .result-head .title { font-size: 1.3rem; font-weight: 700; }
  .result-head.ACC .title { color: #065f46; }
  .result-head.CAD .title { color: #92400e; }
  .result-head.REJ .title { color: #991b1b; }
  .result-head .sub { font-size: 0.88rem; margin-top: 6px; color: #6b7280; }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .info-table td { padding: 9px 4px; border-bottom: 1px dashed #e5e7eb;
    font-size: 0.9rem; vertical-align: top; }
  .info-table td.k { color: #6b7280; width: 40%; }
  .info-table td.v { color: #1f2937; font-weight: 600; text-align: right; }
  .notice { padding: 14px 18px; border-radius: 10px; font-size: 0.85rem;
    line-height: 1.6; margin-bottom: 16px; }
  .notice.info { background: #eff6ff; border-left: 4px solid #1a5490; color: #1e40af; }
  .notice.warn { background: #fef3c7; border-left: 4px solid #d97706; color: #92400e; }
  .notice.err { background: #fee2e2; border-left: 4px solid #dc2626; color: #991b1b; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions button, .actions a { flex: 1; min-width: 140px;
    padding: 12px 20px; border: none; border-radius: 10px;
    font-size: 0.92rem; font-weight: 600; cursor: pointer;
    font-family: inherit; text-decoration: none; text-align: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-print { background: #1a5490; color: #fff; }
  .btn-print:hover { background: #143f6e; }
  .btn-secondary { background: #e5e7eb; color: #1f2937; }
  .btn-secondary:hover { background: #d1d5db; }
  .loading { text-align: center; padding: 30px; color: #6b7280; }
  .loading .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb;
    border-top-color: #1a5490; border-radius: 50%; margin: 0 auto 12px;
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-note { text-align: center; margin-top: 20px; font-size: 0.78rem;
    color: #9ca3af; }
  #print-area { display: none; }
    @media print {
    /* Margin normal — teks tidak melebar */
    @page { size: A4 portrait; margin: 15mm 18mm; }
    html, body { background: #fff !important; }
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { display: block !important;
      position: absolute; left: 0; top: 0; width: 100%;
      font-family: 'Times New Roman', Times, serif; color: #000; }
    .no-print { display: none !important; }

    .doc { padding: 0; font-size: 12pt; line-height: 1.5; }

    /* ==========================================================
     * KOP DILEBARKAN 20 cm — hanya gambar KOP
     * ========================================================== */
    .doc .kop-img {
      width: 20cm;
      max-width: none;
      height: auto;
      max-height: 45mm;
      object-fit: contain;
      display: block;
      margin-left: -1.3cm;
      margin-right: -1.3cm;
      margin-bottom: 4mm;
    }
    .doc .kop-fallback {
      margin-left: -1.3cm;
      margin-right: -1.3cm;
      margin-bottom: 4mm;
    }

    .doc .judul { text-align: center; margin: 6mm 0 2mm; }
    .doc .judul h3 { font-size: 14pt; font-weight: 700;
      text-decoration: underline; letter-spacing: 0.5px; margin: 0; }
    .doc .judul .nomor { font-size: 10.5pt; margin-top: 2mm; }
    .doc .pembuka { margin: 5mm 0; text-align: justify; }
    .doc .data-siswa { margin: 4mm 0 5mm 8mm;
      border-collapse: collapse; width: calc(100% - 8mm); }
    .doc .data-siswa td { padding: 1mm 0; vertical-align: top; font-size: 11.5pt; }
    .doc .data-siswa td.k { width: 40mm; }
    .doc .data-siswa td.c { width: 5mm; }
    .doc .data-siswa td.v { font-weight: 600; }
    .doc .keputusan-box { border: 2px solid #000; padding: 4mm;
      text-align: center; margin: 5mm 0; background: #f5f5f5; }
    .doc .keputusan-box .kecil { font-size: 10pt; }
    .doc .keputusan-box .besar { font-size: 18pt; font-weight: 700;
      letter-spacing: 3px; margin: 1.5mm 0; }
    .doc .penutup { margin: 5mm 0; text-align: justify; }
    .doc .info-du { border: 1px solid #000; padding: 3mm 4mm;
      margin: 4mm 0; font-size: 10.5pt; }
    .doc .info-du .judul-du { font-weight: 700;
      border-bottom: 1px solid #000; padding-bottom: 1mm; margin-bottom: 2mm; }
    .doc .info-du ul { margin: 0; padding-left: 5mm; }
    .doc .info-du li { margin-bottom: 1mm; }
        /* ====== TANDA TANGAN 2 KOLOM ====== */
    .doc .ttd-2col {
      margin-top: 12mm;
      display: flex;
      justify-content: space-between;
      gap: 8mm;
      page-break-inside: avoid;
    }
    .doc .ttd-kolom {
      flex: 1;
      text-align: center;
      font-size: 12pt;
    }
    .doc .ttd-kolom .jabatan { margin-bottom: 1mm; }
    .doc .ttd-kolom .ttd-img {
      display: block;
      width: 3.5cm;
      max-height: 22mm;
      object-fit: contain;
      margin: 0 auto;
    }
    .doc .ttd-kolom .ttd-placeholder {
      height: 22mm;
      display: block;
    }
    .doc .ttd-kolom .nama {
      font-weight: 700;
      text-decoration: underline;
      margin-top: 1mm;
    }
    .doc .ttd-kolom .nipm {
      font-size: 11pt;
      margin-top: 1mm;
    }
    .doc .ttd .nama { font-weight: 700; text-decoration: underline; display: inline-block; }
    .doc .ttd .nipm { font-size: 10pt; margin-top: 1mm; }
    .doc .catatan-kaki { margin-top: 8mm; padding-top: 3mm;
      border-top: 1px solid #666; font-size: 8.5pt;
      font-style: italic; color: #444; text-align: center; }
  }
  @media (max-width: 600px) {
    .card { padding: 22px; }
    .form-row { flex-direction: column; }
    .form-row button { width: 100%; }
    .info-table td { display: block; width: 100% !important;
      text-align: left !important; padding: 4px 0; border: none; }
    .info-table td.k { font-weight: 600; margin-top: 6px; }
  }
</style>
</head>
<body>

<div class="card no-print">
  <div class="head">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    <h1>Pengumuman Hasil Seleksi</h1>
    <p>SPMB SMK Muhammadiyah 1 Surakarta — TP 2027/2028</p>
  </div>
  <div id="search-box">
    <div class="form-row">
      <input type="text" id="inp-nomor" placeholder="PMB-2728-XXX" autocomplete="off" maxlength="20">
      <button id="btn-cari">🔍 Cek</button>
    </div>
    <div class="back-link"><a href="index.html">← Kembali ke halaman utama</a></div>
  </div>
  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div><div>Memuat data pengumuman...</div>
  </div>
  <div id="result" class="result"></div>
  <div class="footer-note" id="footer-note" style="display:none;">
    Powered by SPMB SMK Muhammadiyah 1 Surakarta
  </div>
</div>

<div id="print-area"></div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script src="api.js"></script>
<script>
(function () {
  'use strict';
  var state = { nomor: '', data: null, konsentrasiMap: {} };
  var inpNomor = document.getElementById('inp-nomor');
  var btnCari = document.getElementById('btn-cari');
  var loading = document.getElementById('loading');
  var result = document.getElementById('result');
  var searchBox = document.getElementById('search-box');
  var footerNote = document.getElementById('footer-note');

  inpNomor.addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
  });
  inpNomor.addEventListener('keydown', function (e) { if (e.key === 'Enter') btnCari.click(); });
  var qNomor = Utils.getQueryParam('nomor');
  if (qNomor) { inpNomor.value = qNomor.toUpperCase(); setTimeout(function () { btnCari.click(); }, 300); }

  // Preload konsentrasi
  function loadKonsentrasiMap() {
    return Api.settings.listKonsentrasi().then(function (res) {
      if (res && res.success && res.data && res.data.konsentrasi) {
        res.data.konsentrasi.forEach(function (k) {
          state.konsentrasiMap[k.konsentrasi_id] = k.nama_konsentrasi || '';
        });
      }
    }).catch(function () {});
  }
  loadKonsentrasiMap();

  function labelKonsentrasi(id) {
    if (!id) return '-';
    var key = String(id);
    var nama = state.konsentrasiMap[key];
    return nama ? (key + ' — ' + nama) : key;
  }

  btnCari.addEventListener('click', doSearch);

  function doSearch() {
    var nomor = inpNomor.value.trim().toUpperCase();
    if (!nomor) { Utils.toast('Masukkan nomor pendaftaran', 'error'); inpNomor.focus(); return; }
    state.nomor = nomor;
    searchBox.style.display = 'none';
    result.classList.remove('show');
    result.innerHTML = '';
    loading.style.display = 'block';
    footerNote.style.display = 'none';

    Api.public.getPengumuman(nomor).then(function (res) {
      loading.style.display = 'none';
      if (!res || !res.success) {
        showError(res && res.message ? res.message : 'Gagal memuat data',
          res && res.code ? res.code : '');
        return;
      }
      state.data = res.data;
      showResult(res.data);
    }).catch(function (err) {
      loading.style.display = 'none';
      showError(err.message || 'Terjadi kesalahan', '');
    });
  }

  function showError(message, code) {
    searchBox.style.display = 'block';
    footerNote.style.display = 'block';
    var cls = 'err', icon = '❌';
    if (code === 'FORBIDDEN') { cls = 'warn'; icon = '⏳'; }
    else if (code === 'NOT_FOUND') { cls = 'warn'; icon = '🔍'; }
    result.innerHTML =
      '<div class="notice ' + cls + '">' +
        '<div style="font-size:2rem;text-align:center;margin-bottom:8px;">' + icon + '</div>' +
        '<div style="text-align:center;font-weight:600;">' + Utils.escapeHtml(message) + '</div>' +
      '</div>' +
      '<div class="actions"><button class="btn-secondary" onclick="location.reload()">← Coba Nomor Lain</button></div>';
    result.classList.add('show');
  }

  function showResult(d) {
    footerNote.style.display = 'block';
    var kep = String(d.keputusan || '').toUpperCase();
    var headCls = 'CAD', headIcon = '⏳';
    var headTitle = 'HASIL BELUM DIUMUMKAN';
    var headSub = 'Silakan cek kembali nanti.';
    if (kep === 'DITERIMA') {
      headCls = 'ACC'; headIcon = '🎉';
      headTitle = 'SELAMAT, ANDA DITERIMA!';
      headSub = 'Anda dinyatakan LULUS seleksi SPMB SMK Muhammadiyah 1 Surakarta.';
    } else if (kep === 'CADANGAN') {
      headCls = 'CAD'; headIcon = '⏳';
      headTitle = 'ANDA MASUK DAFTAR CADANGAN';
      headSub = 'Anda akan dihubungi jika ada kuota yang tersedia.';
    } else if (kep === 'TIDAK_DITERIMA') {
      headCls = 'REJ'; headIcon = '😔';
      headTitle = 'MAAF, BELUM DITERIMA';
      headSub = 'Terima kasih atas partisipasi Anda. Tetap semangat!';
    }
    var kons1 = labelKonsentrasi(d.konsentrasi_1);

    var html = '';
    html += '<div class="result-head ' + headCls + '">' +
      '<div class="icon">' + headIcon + '</div>' +
      '<div class="title">' + Utils.escapeHtml(headTitle) + '</div>' +
      '<div class="sub">' + Utils.escapeHtml(headSub) + '</div></div>';
    html += '<table class="info-table">' +
      '<tr><td class="k">Nomor Pendaftaran</td><td class="v">' + Utils.escapeHtml(d.nomor_pendaftaran) + '</td></tr>' +
      '<tr><td class="k">Nama Lengkap</td><td class="v">' + Utils.escapeHtml(d.nama_lengkap) + '</td></tr>' +
      '<tr><td class="k">NISN</td><td class="v">' + Utils.escapeHtml(d.nisn || '-') + '</td></tr>' +
      '<tr><td class="k">Sekolah Asal</td><td class="v">' + Utils.escapeHtml(d.sekolah_asal || '-') + '</td></tr>' +
      '<tr><td class="k">Konsentrasi Keahlian</td><td class="v">' + Utils.escapeHtml(kons1) + '</td></tr>' +
    '</table>';
    if (kep === 'DITERIMA' && d.daftar_ulang) {
      var batas = d.daftar_ulang.batas_daftar_ulang;
      html += '<div class="notice info">📌 <strong>Wajib Daftar Ulang</strong><br>' +
        'Batas daftar ulang: <strong>' + Utils.formatTanggal(batas) + '</strong><br>' +
        'Datang ke sekolah dengan membawa: fotokopi KK, fotokopi Akta, foto 3×4 (2 lembar), dan kuitansi pendaftaran.</div>';
    }
    if (kep === 'CADANGAN') {
      html += '<div class="notice warn">⏳ <strong>Status Cadangan</strong><br>' +
        'Jika ada calon siswa DITERIMA yang tidak daftar ulang, Anda akan dihubungi oleh panitia SPMB.</div>';
    }
    if (d.decision_notes) {
      html += '<div class="notice info"><strong>Catatan Panitia:</strong><br>' + Utils.escapeHtml(d.decision_notes) + '</div>';
    }
    html += '<div class="actions">';
    if (kep === 'DITERIMA') html += '<button class="btn-print" id="btn-print">🖨️ Cetak Pengumuman</button>';
    html += '<button class="btn-secondary" id="btn-again">← Cek Nomor Lain</button></div>';

    result.innerHTML = html;
    result.classList.add('show');

    if (kep === 'DITERIMA') {
      document.getElementById('btn-print').addEventListener('click', function () {
        renderPrintArea(d);
        setTimeout(function () { window.print(); }, 300);
      });
    }
    document.getElementById('btn-again').addEventListener('click', function () {
      result.classList.remove('show');
      result.innerHTML = '';
      inpNomor.value = '';
      inpNomor.focus();
      searchBox.style.display = 'block';
    });
  }

  /* ============================================================
   * CETAK PENGUMUMAN A4
   * ============================================================ */
  function renderPrintArea(d) {
    var s = d.sekolah || {};
    var tglKeputusan = d.decision_date ? new Date(d.decision_date) : new Date();
    var kons1 = labelKonsentrasi(d.konsentrasi_1);

    // Deadline daftar ulang
    // Prioritas: backend kirim → pakai. Fallback: hitung sendiri.
      var batasDU = (d.daftar_ulang && d.daftar_ulang.batas_daftar_ulang) || '';
      if (!batasDU && d.gelombang_tanggal_selesai) {
        batasDU = d.gelombang_tanggal_selesai;
      }
      if (!batasDU && d.gelombang_reguler && d.daftar_ulang && d.daftar_ulang.tanggal_diterima) {
        var tgl = new Date(d.daftar_ulang.tanggal_diterima);
        batasDU = new Date(tgl.getTime() + 14 * 24 * 60 * 60 * 1000).toISOString();
      }
      if (!batasDU) batasDU = (s && s.batas_daftar_ulang) || '';
    var kalimatDU = batasDU
      ? 'Peserta yang dinyatakan DITERIMA wajib melakukan <strong>daftar ulang</strong> ' +
        'paling lambat <strong>' + Utils.formatTanggal(batasDU) + '</strong>. ' +
        'Apabila sampai batas waktu tersebut peserta tidak melakukan daftar ulang, maka ' +
        'dianggap <em>mengundurkan diri</em> dan kuota akan dialihkan kepada peserta cadangan.'
      : 'Peserta yang dinyatakan DITERIMA wajib melakukan <strong>daftar ulang</strong> ' +
        'sesuai jadwal gelombang yang berlaku. Apabila sampai batas waktu yang ditentukan ' +
        'peserta tidak melakukan daftar ulang, maka dianggap <em>mengundurkan diri</em> ' +
        'dan kuota akan dialihkan kepada peserta cadangan.';

    // KOP: gambar utama + fallback teks
        var kopFallback =
      '<div class="kop-fallback" style="display:flex;align-items:center;gap:5mm;' +
        'border-bottom:2px solid #000;padding-bottom:3mm;">' +
        '<img src="logo.png" style="width:22mm;height:22mm;object-fit:contain;" ' +
          'onerror="this.style.display=\'none\'">' +
        '<div style="flex:1;text-align:center;">' +
          '<h2 style="font-size:14pt;font-weight:700;margin:0;">' +
            Utils.escapeHtml(s.nama_sekolah || 'SMK MUHAMMADIYAH 1 SURAKARTA') + '</h2>' +
          '<p style="font-size:9pt;margin:1mm 0 0;">' + Utils.escapeHtml(s.alamat_sekolah || '') + '</p>' +
          '<p style="font-size:9pt;margin:0;">Telp: ' + Utils.escapeHtml(s.telepon_sekolah || '-') +
            ' | Email: ' + Utils.escapeHtml(s.email_sekolah || '-') + '</p>' +
        '</div></div>';

    var kop =
      '<img src="kop-surat.png" class="kop-img" alt="KOP" ' +
        'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
      '<div style="display:none;">' + kopFallback + '</div>';

    var html =
      '<div class="doc">' + kop +
        '<div class="judul">' +
          '<h3>PENGUMUMAN HASIL SELEKSI PENERIMAAN MURID BARU</h3>' +
          '<div class="nomor">' +
            (d.letter_number ? 'Nomor: ' + Utils.escapeHtml(d.letter_number) : '') +
          '</div></div>' +
        '<div class="pembuka">' +
          'Berdasarkan hasil seleksi Penerimaan Murid Baru (SPMB) ' +
          Utils.escapeHtml(s.nama_sekolah || 'SMK Muhammadiyah 1 Surakarta') +
          ' Tahun Pelajaran ' + Utils.escapeHtml(s.tahun_ajaran || '2027/2028') +
          ', dengan ini kami sampaikan bahwa:' +
        '</div>' +
        '<table class="data-siswa">' +
          '<tr><td class="k">Nama Lengkap</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(d.nama_lengkap) + '</td></tr>' +
          '<tr><td class="k">Nomor Pendaftaran</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(d.nomor_pendaftaran) + '</td></tr>' +
          '<tr><td class="k">NISN</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(d.nisn || '-') + '</td></tr>' +
          '<tr><td class="k">Tempat, Tanggal Lahir</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(d.tempat_lahir || '-') +
            (d.tanggal_lahir ? ', ' + Utils.formatTanggal(d.tanggal_lahir) : '') +
            '</td></tr>' +
          '<tr><td class="k">Sekolah Asal</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(d.sekolah_asal || '-') + '</td></tr>' +
          '<tr><td class="k">Konsentrasi Keahlian</td><td class="c">:</td>' +
            '<td class="v">' + Utils.escapeHtml(kons1) + '</td></tr>' +
        '</table>' +
                '<div class="keputusan-box">' +
          '<div class="kecil">DINYATAKAN</div>' +
          '<div class="besar">DITERIMA</div>' +
          (d.gelombang_nama ? '<div class="kecil">' + Utils.escapeHtml(d.gelombang_nama) + '</div>' : '') +
          '<div class="kecil">sebagai calon murid baru</div></div>' +
        '<div class="penutup">' + kalimatDU + '</div>';

    if (batasDU) {
      html +=
        '<div class="info-du">' +
          '<div class="judul-du">📌 INFORMASI DAFTAR ULANG</div>' +
          '<ul>' +
            '<li>Batas akhir daftar ulang: <strong>' + Utils.formatTanggal(batasDU) + '</strong></li>' +
            '<li>Tempat: ' + Utils.escapeHtml(s.nama_sekolah || '') +
              (s.alamat_sekolah ? ' — ' + Utils.escapeHtml(s.alamat_sekolah) : '') + '</li>' +

    document.getElementById('print-area').innerHTML = html;
