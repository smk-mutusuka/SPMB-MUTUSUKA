name: Generate QR Code SPMB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-qr:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install qrencode
        run: sudo apt-get update && sudo apt-get install -y qrencode

      - name: Generate QR Code
        run: qrencode -o qr-spmb.png -s 10 -m 2 "https://smk-mutusuka.github.io/SPMB-MUTUSUKA/"

      - name: Commit dan Push QR Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qr-spmb.png
          git commit -m "Update QR Code SPMB otomatis" || exit 0
          git push
